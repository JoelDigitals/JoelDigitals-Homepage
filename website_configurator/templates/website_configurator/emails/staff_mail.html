<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>{{ subject }}</title>
    <style>
        body {
            background-color: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 640px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .header {
            background: linear-gradient(135deg, #0044cc, #0066ff);
            color: #ffffff;
            padding: 24px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
        }
        .content {
            padding: 30px;
            color: #334155;
            line-height: 1.6;
        }
        .message-box {
            background-color: #f1f5f9;
            border-left: 4px solid #0044cc;
            padding: 16px;
            border-radius: 6px;
            margin: 8px 0 20px;
            white-space: pre-wrap;
        }
        .ref-box {
            display: inline-block;
            background-color: #eef2ff;
            color: #0044cc;
            border-radius: 6px;
            padding: 4px 10px;
            font-family: monospace;
            font-size: 13px;
        }
        .footer {
            background-color: #f8fafc;
            padding: 20px;
            font-size: 13px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Joel Digitals</h1>
    </div>

    <div class="content">
        <div class="message-box">{{ message }}</div>
        <span class="ref-box">Referenz: {{ config_request.reference }}</span>
    </div>

    <div class="footer">
        © {{ now|date:"Y" }} Joel Digitals · Website-Konfigurator<br>
        Bei Rückfragen antworte einfach direkt auf diese E-Mail.
    </div>
</div>

</body>
</html>
